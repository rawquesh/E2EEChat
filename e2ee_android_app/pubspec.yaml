name: e2ee_android_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0-132.0.dev

dependencies:
  flutter:
    sdk: flutter

  e2ee_models_app:
    path: ../e2ee_models_app


  cupertino_icons: ^1.0.8

  loading_animation_widget: ^1.3.0
  fluttertoast: ^8.2.12
  image_picker: ^1.1.2
  pinput: ^5.0.1
  audioplayers: ^6.4.0
  file_picker: ^9.2.3

  #Security & Keys
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  pusher_client_socket: ^0.0.5

  #notification
  # flutter_local_notifications: ^19.3.1

  #permission
  permission_handler: ^12.0.1

  #record audio
  record: ^6.0.0
  open_filex: ^4.0.0

  #Media Compression
  flutter_image_compress: ^2.4.0
  video_compress: ^3.1.4

  #webrtc
  flutter_webrtc: ^0.14.2

  #One Signal Notification
  onesignal_flutter: ^5.3.4



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4


flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_foreground.png"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"
  adaptive_icon_background: "#000000"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
