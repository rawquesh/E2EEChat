name: e2ee_models_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0-132.0.dev

dependencies:
  ####################
  # Utils #
  ####################
  encrypt: ^5.0.3
  intl: ^0.20.1
  shared_preferences: ^2.3.5
  uuid: ^4.4.0
  path_provider: ^2.1.5
  overlay_support: ^2.1.0

  ####################
  # State management #
  ####################
  provider: ^6.1.2

  ####################
  # Offline Database #
  ####################
  hive: ^2.2.3

  #######
  # UI #
  #######
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  loading_animation_widget: ^1.3.0
  shimmer: ^3.0.0
  fluttertoast: ^8.2.12

  #Security & Keys
  flutter_secure_storage: ^9.2.4

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

