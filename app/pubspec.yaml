name: e2ee_android_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0-132.0.dev

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  loading_animation_widget: ^1.3.0
  fluttertoast: ^8.2.12
  image_picker: ^1.1.2
  pinput: ^5.0.1
  audioplayers: ^6.4.0
  file_picker: ^9.2.3

  #Security & Keys
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  pusher_client_socket: ^0.0.5

  #permission
  permission_handler: ^12.0.1

  #record audio
  record: ^6.0.0
  open_filex: ^4.0.0

  #Media Compression
  flutter_image_compress: ^2.4.0
  video_compress: ^3.1.4
  image: ^4.5.4

  #webrtc
  flutter_webrtc: ^0.14.2

  #One Signal Notification
  onesignal_flutter: ^5.3.4
  disable_battery_optimization:
    git:
      url: https://github.com/pvsvamsi/Disable-Battery-Optimizations
      ref: 3bd744d

  # Previously from e2ee_models_app
  encrypt: ^5.0.3
  intl: ^0.20.1
  shared_preferences: ^2.3.5
  uuid: ^4.4.0
  path_provider: ^2.1.5
  overlay_support: ^2.1.0
  provider: ^6.1.2
  hive: ^2.2.3
  cached_network_image: ^3.4.1
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  http: ^1.2.0
  http_parser: ^4.0.2
  go_router: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4


flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_foreground.png"
  adaptive_icon_foreground: "assets/images/logo_foreground.png"
  adaptive_icon_background: "#000000"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
